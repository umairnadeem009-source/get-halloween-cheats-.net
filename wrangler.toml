# Static Astro site → Cloudflare Workers static assets (npm run build && npm run deploy).
# Do not add @astrojs/cloudflare SSR adapter; keep prerendered HTML in dist/.
name = "gethalloweencheats-net"
compatibility_date = "2025-10-11"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# public/_redirects and public/_headers are copied into dist/ on build.
